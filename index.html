<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mehmmy – back in a moment</title>
<style>
  :root { --cream:#fff8ec; --ink:#161512; --yellow:#ffd23f; --muted:#6b6557; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
         background:var(--cream); color:var(--ink); font-family: system-ui, -apple-system, sans-serif; }
  .card { max-width:420px; width:100%; background:#fff; border:2.5px solid var(--ink); border-radius:20px;
          box-shadow:5px 5px 0 var(--ink); padding:24px; text-align:center; }
  .badge { width:84px; height:84px; margin:0 auto 14px; border-radius:50%; background:var(--yellow);
           border:3px solid var(--ink); display:grid; place-items:center; font-size:40px; }
  h1 { margin:0 0 8px; font-size:26px; }
  p { margin:0; color:var(--muted); line-height:1.45; }
</style>
</head>
<body>
  <main class="card">
    <div class="badge" aria-hidden="true">🚗</div>
    <h1>Mehmmy is moving</h1>
    <p>The crew board is being moved to its new home and will be back shortly. Your Mehmmys are safe — nothing has been lost.</p>
  </main>
</body>
</html>
