name: Mehmmy
options:
  bundleIdPrefix: com.ozankilic
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 13.1.1
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 10.1.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: Z59KW29SGF
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Mehmmy:
    type: application
    platform: iOS
    sources:
      - path: Mehmmy
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseMessaging
      - package: GoogleSignIn
        product: GoogleSignIn
    entitlements:
      path: Mehmmy/Mehmmy.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ozankilic.mehmmys
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
        PRODUCT_NAME: Mehmmy
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Mehmmy/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  MehmmyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MehmmyTests
    dependencies:
      - target: Mehmmy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ozankilic.mehmmys.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Mehmmy.app/Mehmmy"
        BUNDLE_LOADER: "$(TEST_HOST)"
  MehmmyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MehmmyUITests
    dependencies:
      - target: Mehmmy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ozankilic.mehmmys.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Mehmmy
schemes:
  Mehmmy:
    build:
      targets:
        Mehmmy: all
        MehmmyTests: [test]
        MehmmyUITests: [test]
    test:
      targets:
        - MehmmyTests
        - MehmmyUITests
