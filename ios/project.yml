name: Mehmmy
options:
  bundleIdPrefix: com.ozankilic
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: Z59KW29SGF
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Mehmmy:
    type: application
    platform: iOS
    sources:
      - path: Mehmmy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ozankilic.mehmmys
        PRODUCT_NAME: Mehmmy
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Mehmmy/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  MehmmyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MehmmyTests
    dependencies:
      - target: Mehmmy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ozankilic.mehmmys.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Mehmmy.app/Mehmmy"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Mehmmy:
    build:
      targets:
        Mehmmy: all
        MehmmyTests: [test]
    test:
      targets:
        - MehmmyTests
